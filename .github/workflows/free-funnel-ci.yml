name: Free Funnel Release Gate

on:
  pull_request:
    paths:
      - 'src/challenge14.js'
      - 'src/challenge21.js'
      - 'src/index.js'
      - 'src/identity.js'
      - 'src/milestones.js'
      - 'src/freeFunnelReleaseWrapper.js'
      - 'src/brevo.js'
      - 'src/v1LegalPages.js'
      - 'src/v1LaunchWrapper.js'
      - 'test/freeFunnelRelease.spec.js'
      - 'test/v1LaunchBlockers.spec.js'
      - 'migrations/0006_milestone_events.sql'
      - 'wrangler.toml'
      - '.github/workflows/free-funnel-ci.yml'
  workflow_dispatch:

jobs:
  verify-free-funnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Validate Free Funnel Syntax
        run: node --check src/identity.js && node --check src/milestones.js && node --check src/freeFunnelReleaseWrapper.js && node --check src/brevo.js && node --check src/v1LegalPages.js && node --check src/v1LaunchWrapper.js

      - name: Run Full Regression Suite
        run: npm test
