name: Mastery Feature CI

on:
  pull_request:
    paths:
      - 'src/mastery*.js'
      - 'src/worker.js'
      - 'test/mastery*.spec.js'
      - 'migrations/0003_mastery_v1.sql'
      - 'migrations/0004_mastery_payments.sql'
      - 'docs/MASTERY_V1_*.md'
      - '.github/workflows/mastery-ci.yml'
  workflow_dispatch:

jobs:
  verify-mastery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Validate Mastery Syntax
        run: node --check src/masteryLogic.js && node --check src/masteryApi.js && node --check src/masteryPayments.js && node --check src/masteryDashboardV2.js && node --check src/worker.js

      - name: Run Test Suite
        run: npm test
