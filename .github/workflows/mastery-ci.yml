name: Feature Validation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mastery-ci.yml'
  push:
    branches:
      - feature/advertising-readiness-v1
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mastery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Validate JavaScript Syntax
        run: |
          node --check src/index.js
          node --check src/worker.js
          node --check src/eventTaxonomy.js
          node --check src/participantLifecycle.js
          node --check src/participantRoutes.js
          node --check src/participantClientEnhancer.js
          node --check src/challenge14.js
          node --check src/challenge21.js
          node --check src/masteryLogic.js
          node --check src/masteryApi.js
          node --check src/masteryProof.js
          node --check src/masteryProofApi.js
          node --check src/masteryDashboard.js

      - name: Run Test Suite
        run: npm test

      - name: Safety Check
        run: echo "Validation only — no remote migrations and no Cloudflare deployment."
