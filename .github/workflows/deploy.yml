name: Deploy Team Flex Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Validate Syntax
        run: node --check src/index.js && node --check src/worker.js && node --check src/masteryApi.js && node --check src/masteryProof.js && node --check src/masteryProofApi.js && node --check src/masteryDashboard.js

      - name: Run Test Suite
        run: npm test

      - name: Ensure private Mastery Proof R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@latest r2 bucket info the-flex-standard-mastery-proof --json >/dev/null 2>&1; then
            echo 'Mastery Proof bucket already exists.'
          else
            npx --yes wrangler@latest r2 bucket create the-flex-standard-mastery-proof
            npx --yes wrangler@latest r2 bucket info the-flex-standard-mastery-proof --json >/dev/null
          fi

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest d1 migrations apply flex-standard-db --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
