name: PR Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Validate Syntax
        run: node --check src/index.js && node --check src/worker.js && node --check src/masteryApi.js && node --check src/masteryProof.js && node --check src/masteryProofApi.js && node --check src/masteryDashboard.js && node --check src/challengeProgression.js && node --check src/progressionWrapper.js && node --check src/milestoneApi.js

      - name: Run Test Suite
        run: npm test
