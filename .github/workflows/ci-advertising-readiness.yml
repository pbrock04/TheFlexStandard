name: Advertising Readiness CI

on:
  push:
    branches:
      - feature/advertising-readiness-v1
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-advertising-readiness.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Validate JavaScript Syntax
        run: |
          node --check src/index.js
          node --check src/worker.js
          node --check src/eventTaxonomy.js
          node --check src/participantLifecycle.js
          node --check src/participantRoutes.js
          node --check src/masteryApi.js
          node --check src/masteryProof.js
          node --check src/masteryProofApi.js
          node --check src/masteryDashboard.js

      - name: Run Test Suite
        run: npm test

      - name: Confirm No Deployment Step
        run: echo "Validation only. No D1 migration or Cloudflare deployment runs in this workflow."
