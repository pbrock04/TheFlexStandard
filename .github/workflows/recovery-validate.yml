name: Production Alignment Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify aligned production configuration
        shell: bash
        run: |
          test -f wrangler.jsonc
          test -f public/index.html
          test -f src/index.js
          test -f migrations/0001_generalized_challenges.sql
          grep -q '"name": "the-flex-standard"' wrangler.jsonc
          grep -q '"main": "src/index.js"' wrangler.jsonc
          grep -q '"binding": "DB"' wrangler.jsonc
          grep -q '"database_name": "flex-standard-db"' wrangler.jsonc
          grep -q '"database_id": "64964ca4-4517-4adb-8da4-cf6e0fd97003"' wrangler.jsonc
          if grep -Eq '"routes?"|theflexstandard\.com' wrangler.jsonc; then
            echo "Refusing validation: production route must remain unattached until the explicit deployment gate."
            exit 1
          fi

      - name: Wrangler dry run only
        run: npx wrangler@latest deploy --dry-run --config wrangler.jsonc
