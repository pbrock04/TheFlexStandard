name: Mastery Private Staging Deploy

on:
  push:
    branches:
      - feature/28-day-mastery-v1
    paths:
      - 'src/**'
      - 'test/mastery*.spec.js'
      - 'wrangler.mastery-staging.toml'
      - '.github/workflows/mastery-staging-deploy.yml'
  workflow_dispatch:

jobs:
  test-and-deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Validate Mastery Syntax
        run: node --check src/mastery28Core.js && node --check src/mastery28Page.js && node --check src/masteryFeatureWrapper.js && node --check src/freeFunnelReleaseWrapper.js

      - name: Run Test Suite
        run: npm test

      - name: Deploy Isolated Mastery Staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.mastery-staging.toml
